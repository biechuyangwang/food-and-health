<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识自测 · 食物与健康</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="topnav" id="topnav"></nav>
<div id="compatBanner" style="display:none"></div>
<script>
/* 兼容性自检（纯 ES5） */
(function () {
  var errs = [];
  window.onerror = function (m, s, l) { errs.push(String(m) + ' @' + String(s || '').split('/').pop() + ':' + l); return false; };
  function show() {
    var el = document.getElementById('compatBanner');
    if (!el) return;
    var msg = '';
    if (typeof HUI === 'undefined' && !window.HUI) {
      msg = '交互组件库 assets/healthui.js 未能加载：请确认 assets 文件夹完整，并从 index.html 进入。';
    } else if (errs.length) {
      msg = '页面脚本报错：' + errs.slice(0, 2).join('；');
    }
    if (msg) {
      el.style.cssText = 'display:block;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#d03b3b;color:#fff;padding:10px 18px;font-size:14px;line-height:1.7';
      el.innerHTML = '⚠ 本页交互内容无法运行 —— ' + msg + ' 若仍异常，请改用 Chrome 或新版 Edge 浏览器打开本页。';
    }
  }
  if (document.readyState === 'complete') { show(); } else if (window.addEventListener) { window.addEventListener('load', show); }
})();
</script>

<div class="layout">
  <aside class="toc" id="toc"></aside>
  <main>
    <div class="chapter-hero">
      <div class="hero-emoji">✍️</div>
      <div class="ch-no">第 10 章 · 自测与参考</div>
      <h1>知识自测</h1>
      <p>八个分卷共 <b>55 题</b> + 综合随机 15 题，每题附<b>完整解析与出处</b>。成绩与错题保存在本机浏览器（localStorage）。
      学完对应章节再来测，效果最好。</p>
    </div>

    <section class="topic" id="s1">
      <h2><span class="secno">10.1</span> 选择分卷</h2>
      <div class="card">
        <div id="bankChips"></div>
        <div id="quiz1" style="margin-top:14px"></div>
      </div>
    </section>

    <section class="topic" id="s2">
      <h2><span class="secno">10.2</span> 📌 错题回顾</h2>
      <div class="card">
        <p class="small muted">汇总各分卷最近一次作答的错题（重新做对所属分卷并全对后，该卷错题清空）。</p>
        <div id="wrongBox"></div>
      </div>
    </section>
  </main>
</div>

<script src="assets/healthui.js"></script>
<script src="assets/img/credits.js"></script>
<script src="assets/data.js"></script>
<script>
HUI.renderNav('quiz.html');
HUI.footer();
HUI.pager('quiz.html');
HUI.progress('quiz.html');

document.getElementById('toc').innerHTML = '<div class="toc-title">本章目录</div>' +
  ['s1|10.1 选择分卷', 's2|10.2 错题回顾'].map(x => { const p = x.split('|'); return '<a href="#' + p[0] + '">' + p[1] + '</a>'; }).join('');

(function () {
  const D = window.HDATA;
  const BANKS = [
    ['nutrient', '营养素基础'], ['foods', '食物图鉴'], ['pairing', '搭配宜忌'],
    ['metabolic', '食疗·代谢'], ['gi', '食疗·消化免疫'], ['fitness', '增强体质'],
    ['exercise', '运动动作库'], ['herbs', '药食同源']
  ];
  let cur = 'nutrient';

  function bankName(k) { const b = BANKS.find(x => x[0] === k); return b ? b[1] : k; }

  function renderChips() {
    const host = document.getElementById('bankChips');
    host.className = 'chips';
    host.innerHTML = BANKS.map(b => {
      const n = (D.QUIZ_BANK[b[0]] || []).length;
      return `<span class="chip btn ${b[0] === cur ? 'on' : ''}" data-b="${b[0]}">${b[1]}（${n}题）</span>`;
    }).join('') + `<span class="chip btn" data-b="__mix">🎲 综合随机（15题）</span>`;
    Array.prototype.forEach.call(host.querySelectorAll('.chip'), c => {
      c.addEventListener('click', () => { cur = c.getAttribute('data-b'); renderChips(); renderQuiz(); });
    });
  }

  function renderQuiz() {
    if (cur === '__mix') {
      const all = [];
      BANKS.forEach(b => (D.QUIZ_BANK[b[0]] || []).forEach(q => all.push(q)));
      for (let i = all.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = all[i]; all[i] = all[j]; all[j] = t;
      }
      HUI.quiz('quiz1', all.slice(0, 15), { id: 'mix' + (new Date().getDate() || 0) });
      return;
    }
    const items = D.QUIZ_BANK[cur] || [];
    if (!items.length) { document.getElementById('quiz1').innerHTML = '<p class="muted">该分卷题库待补充。</p>'; return; }
    HUI.quiz('quiz1', items, { id: cur });
  }

  function renderWrong() {
    const found = [];
    BANKS.forEach(b => {
      const raw = HUI.store.get('health-wrong-' + b[0]);
      if (!raw) return;
      try {
        const idx = JSON.parse(raw);
        (idx || []).forEach(i => {
          const q = (D.QUIZ_BANK[b[0]] || [])[i];
          if (q) found.push({ bank: b[1], q });
        });
      } catch (e) { }
    });
    const box = document.getElementById('wrongBox');
    if (!found.length) {
      box.innerHTML = '<p>✅ 暂无错题记录——要么全对，要么还没开始。选一个分卷开始吧。</p>';
      return;
    }
    box.innerHTML = found.map(f => `
      <div class="q-item">
        <div class="q-head">${HUI.esc(f.bank)} · 错题</div>
        <div class="q-text">${f.q.q}</div>
        <div class="q-exp show"><b class="y">✓ 正确答案：${'ABCD'[f.q.ans]}</b>　${f.q.exp}</div>
      </div>`).join('');
  }

  renderChips();
  renderQuiz();
  renderWrong();
})();
</script>
</body>
</html>
